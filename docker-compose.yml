services:
  nexus-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-mcp-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NEXUS_MCP_PORT=8080
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
